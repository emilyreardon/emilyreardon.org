      rationale:   "This work explores the inverse of choices made by Big Tech: what is ethical AI, and how can machine learning be reimagined, not just adopted or refused? What might it look like if provenance aligns to public interest rather than profit, if AI is local-only and therefore isn't a climate risk? What is machine learning when the training materials are emotional and pre-literate rather than text-centric, personal and bestowed rather than non-consensually extracted, if the process by which the corpus is collected and trained is slow and intimate, engagement is embodied rather than chatted, and care and safety replace the erosion of trust and confusion of reality? What are machines, what is learning, what is artificial and what is the real that we want?",

      modelCardUrl: null,
      rationale:   "Democracy and its public systems are under attack. Big Tech accelerates disorientation as it routes public engagement away from civic purpose and towards commercial profit. Large scale upheaval and fear introduce malleability, but most people in the U.S. lack a fundamental understanding of how government institutions function and therefore don't have a blueprint for how to effectively advocate for the societal changes they want to see.\n\nAlmost every significant legal change in American history began with someone writing something down: the Federalist Papers as persuasion, the Declaration of Sentiments as grievance, Section 504's sit-in demands as people naming where the law fails them. Political science research confirms the pattern: letters shift legislative attention, constituent contact shapes floor time, and writing is how demands become rights. A public record is an official and permanent account of what a government does and what its people say to it; the Freedom of Information Act guarantees citizens the right to request it. That record outlasts the people who made it. But it has never been complete: enslaved people's testimonies, Indigenous land and sovereignty, and women's political speech are absences throughout most of American history.\n\nPublic Record treats democracy's primary sources not as monument but as materials to think and act with. It uses the same tools Big Tech profits from to grow civic knowledge, counter habits, and demands for futures that love us back.",
      description: "Public Record transforms everyday public spaces into places for civic engagement by making democracy's primary sources interactive and actionable. It uses the same tools that people use for commercial tech — a phone, a public space, a few minutes — to grow civic engagement, knowledge, and counter habits that lead to futures that love us.\n\nA visitor walks through a public space and encounters a large handmade mobile. Each of its 139 elements represents a primary source of American democracy: founding documents, repudiated decisions, broken treaties, movement demands. Bringing a phone near any element opens a short excerpt and a prompt in plain language rooted in that document. The visitor writes a response, something they notice in their own experience of public life and how they might address it. The installation's local AI reads the submission and returns a brief echo anchored to a specific historical clause, connecting what was just written to what others have already fought for. That response enters the installation's own public record, and visitors can send it directly to an elected representative. What someone imagined and wrote while looking at a mobile in a public space becomes, in that moment, civic participation.",

  /* ── Extension fallback for non-GIF images ── */
  const EXTS = ['.jpg', '.jpeg', '.png', '.webp', '.gif'];


  function tryLoadImage(basePath, exts, imgEl, placeholder) {
    if (exts.length === 0) {
      imgEl.style.display = 'none';
      if (placeholder) placeholder.style.display = 'flex';
      return;
    }
    const [next, ...rest] = exts;
    const handler = () => { imgEl.onload = null; imgEl.onerror = null; };
    imgEl.onload = () => {
      handler();
      if (placeholder && placeholder.parentNode) placeholder.parentNode.removeChild(placeholder);
      imgEl.style.display = 'block';
    };
    imgEl.onerror = () => { handler(); tryLoadImage(basePath, rest, imgEl, placeholder); };
    imgEl.src = basePath + next;
  }


  /* ── Build a standard image wrap (extension-tried) ── */
  function buildImageWrap(basePath, altText) {
    const wrap = document.createElement('div');
    wrap.className = 'project-image-wrap';


    const placeholder = document.createElement('div');
    placeholder.className = 'project-image-placeholder';
    placeholder.textContent = 'image';


    const img = document.createElement('img');
    img.className = 'project-image';
    img.alt = altText;
    img.style.display = 'none';


    wrap.appendChild(placeholder);
    wrap.appendChild(img);
    tryLoadImage(basePath, [...EXTS], img, placeholder);
    img.addEventListener('load', function() {
      wrap.style.width = img.naturalWidth + 'px';
      wrap.style.maxWidth = '100%';
    });
    return wrap;
  }


  /* ── Build one element of an image pair. spec is either:
       - a string  → rendered as <img>
       - {type:'video', sources:[...]} → silent, looping, autoplaying <video>
       - {type:'video-player', sources:[...]} → controls <video> sized by actual aspect ratio ── */
  function buildPairElement(spec, altText) {
    if (spec && typeof spec === 'object' && spec.type === 'video') {
      const video = document.createElement('video');
      video.autoplay = true;
      video.loop = true;
      video.muted = true;
      video.defaultMuted = true;
      video.playsInline = true;
      video.setAttribute('aria-label', altText);
      spec.sources.forEach(function(src) {
        const source = document.createElement('source');
        source.src = src;
        source.type = src.slice(-4) === 'webm' ? 'video/webm' : 'video/mp4';
        video.appendChild(source);
      });
      return video;
    }
    if (spec && typeof spec === 'object' && spec.type === 'video-player') {
      const video = document.createElement('video');
      video.controls = true;
      video.preload = 'metadata';
      video.playsInline = true;
      video.setAttribute('aria-label', altText);
      spec.sources.forEach(function(src) {
        const source = document.createElement('source');
        source.src = src;
        const ext = src.split('.').pop().toLowerCase();
        source.type = ext === 'webm' ? 'video/webm' : 'video/mp4';
        video.appendChild(source);
      });
      return video;
    }
    const img = document.createElement('img');
    img.alt = altText;
    img.src = spec;
    return img;
  }


  /* ── Build a row of N columns, each either a single item or a stack of items.
       Measures every loaded image/video's real aspect ratio and computes column
       widths so all columns render at the same height, without cropping or
       stretching anything. No hardcoded ratios — self-adjusts to whatever the
       actual assets are. ── */
  function buildImagePairWrap(columns, altText) {
    const wrap = document.createElement('div');
    wrap.className = 'project-image-pair';


    const colData = columns.map(function(specOrArray) {
      const col = document.createElement('div');
      col.className = 'project-image-pair-col';

      /* vstack: { type: 'vstack', rows: [[item, item], [item]] }
         Renders multiple horizontal rows stacked vertically within one column. */
      if (specOrArray && typeof specOrArray === 'object' && !Array.isArray(specOrArray) && specOrArray.type === 'vstack') {
        col.style.cssText = 'display:flex;flex-direction:column;gap:0.75rem;overflow:hidden;';
        const vstackRows = specOrArray.rows.map(function(rowSpec) {
          const rowItems = Array.isArray(rowSpec) ? rowSpec : [rowSpec];
          const rowDiv = document.createElement('div');
          rowDiv.style.cssText = 'display:flex;gap:0.75rem;flex-shrink:0;overflow:hidden;align-items:flex-start;';
          const elements = rowItems.map(function(spec) {
            const el = buildPairElement(spec, altText);
            el.style.visibility = 'hidden';
            el.style.display = 'block';
            el.style.flexShrink = '0';
            rowDiv.appendChild(el);
            return el;
          });
          col.appendChild(rowDiv);
          return { rowDiv: rowDiv, elements: elements };
        });
        wrap.appendChild(col);
        const allEls = vstackRows.reduce(function(a, rd) { return a.concat(rd.elements); }, []);
        return { col: col, elements: allEls, isVstack: true, vstackRows: vstackRows };
      }

      const items = Array.isArray(specOrArray) ? specOrArray : [specOrArray];
      if (items.length > 1) col.classList.add('project-image-pair-stack');
      const elements = items.map(function(spec) {
        const el = buildPairElement(spec, altText);
        el.style.visibility = 'hidden';
        col.appendChild(el);
        return el;
      });
      wrap.appendChild(col);
      return { col: col, elements: elements };
    });


    function naturalRatio(el) {
      if (el.tagName === 'VIDEO') return el.videoWidth / el.videoHeight;
      return el.naturalWidth / el.naturalHeight;
    }


    let revealed = false;
    function layout() {
      const ks = [];
      for (let i = 0; i < colData.length; i++) {
        if (colData[i].isVstack) {
          /* K for a vstack: treat each row as one stacked item whose effective
             aspect ratio is the sum of its items' aspect ratios (side-by-side). */
          let sumInv = 0;
          const rows = colData[i].vstackRows;
          for (let r = 0; r < rows.length; r++) {
            let rowAspect = 0;
            const rowEls = rows[r].elements;
            for (let j = 0; j < rowEls.length; j++) {
              const ratio = naturalRatio(rowEls[j]);
              if (!ratio) return;
              rowAspect += ratio;
            }
            sumInv += 1 / rowAspect;
          }
          ks.push(1 / sumInv);
        } else {
          let sumInv = 0;
          const els = colData[i].elements;
          for (let j = 0; j < els.length; j++) {
            const r = naturalRatio(els[j]);
            if (!r) return;
            sumInv += 1 / r;
          }
          ks.push(1 / sumInv);
        }
      }
      const gapPx = 12;
      const containerWidth = wrap.clientWidth || (wrap.parentElement && wrap.parentElement.clientWidth) || 0;
      if (!containerWidth) return;
      const availableWidth = containerWidth - gapPx * (colData.length - 1);
      const sumK = ks.reduce(function(a, b) { return a + b; }, 0);
      const height = availableWidth / sumK;
      colData.forEach(function(cd, i) {
        cd.col.style.flex = '0 0 auto';
        const colW = height * ks[i];
        cd.col.style.width = colW + 'px';

        if (cd.isVstack) {
          /* Distribute available column height across rows proportionally */
          const rows = cd.vstackRows;
          const innerGaps = gapPx * (rows.length - 1);
          const availH = height - innerGaps;
          const rowAspects = rows.map(function(rd) {
            return rd.elements.reduce(function(sum, el) { return sum + naturalRatio(el); }, 0);
          });
          const sumInvRow = rowAspects.reduce(function(sum, ra) { return sum + 1 / ra; }, 0);
          rows.forEach(function(rd, ri) {
            const rowH = availH / (rowAspects[ri] * sumInvRow);
            rd.rowDiv.style.height = rowH + 'px';
            rd.elements.forEach(function(el) {
              el.style.height = rowH + 'px';
              el.style.width = (rowH * naturalRatio(el)) + 'px';
            });
          });
        }
      });
      if (!revealed) {
        revealed = true;
        colData.forEach(function(cd) {
          cd.elements.forEach(function(el) { el.style.visibility = 'visible'; });
        });
      }
    }


    colData.forEach(function(cd) {
      cd.elements.forEach(function(el) {
        ['loadedmetadata', 'loadeddata', 'canplay', 'resize', 'load'].forEach(function(evt) {
          el.addEventListener(evt, layout);
        });
        if (el.tagName === 'VIDEO') {
          if (el.readyState >= 1) layout();
        } else if (el.complete) {
          layout();
        }
      });
    });


    window.addEventListener('resize', layout);
    window.addEventListener('load', layout);
    setTimeout(layout, 500);
    setTimeout(layout, 1500);


    return wrap;
  }


  /* ── Build a video wrap ── */
  function buildVideoWrap(src, altText, thumbnailGif) {
    const wrap = document.createElement('div');
    wrap.className = 'project-image-wrap';

    const video = document.createElement('video');
    video.controls = true;
    video.preload = 'metadata';
    video.playsInline = true;
    video.style.cssText = 'width:100%;aspect-ratio:16/9;display:block;background:#000;cursor:pointer;';
    video.setAttribute('aria-label', altText);
    if (thumbnailGif) video.poster = thumbnailGif.split('/').map(function(s){ return encodeURIComponent(s); }).join('/');
    video.src = src;
    wrap.appendChild(video);

    return wrap;
  }


  /* ── Build an audio wrap (custom player) ── */
  function buildAudioWrap(src, altText) {
    const wrap = document.createElement('div');
    wrap.className = 'project-image-wrap';
    wrap.style.marginTop = '0.75rem';

    /* Hidden audio element */
    const audio = document.createElement('audio');
    audio.preload = 'metadata';
    audio.setAttribute('aria-label', altText);
    const source = document.createElement('source');
    source.src = src;
    source.type = src.slice(-3) === 'm4a' ? 'audio/mp4' : 'audio/mpeg';
    audio.appendChild(source);

    /* Custom player UI */
    const player = document.createElement('div');
    player.className = 'audio-player';

    const btn = document.createElement('button');
    btn.className = 'audio-play-btn';
    btn.setAttribute('aria-label', 'Play');
    btn.textContent = '▶';

    const scrubWrap = document.createElement('div');
    scrubWrap.className = 'audio-scrubber-wrap';
    const scrubber = document.createElement('input');
    scrubber.type = 'range';
    scrubber.className = 'audio-scrubber';
    scrubber.min = 0;
    scrubber.max = 100;
    scrubber.value = 0;
    scrubber.step = 0.1;
    scrubWrap.appendChild(scrubber);

    const timeEl = document.createElement('span');
    timeEl.className = 'audio-time';
    timeEl.textContent = '0:00';

    player.appendChild(btn);
    player.appendChild(scrubWrap);
    player.appendChild(timeEl);

    /* Format seconds as m:ss */
    function fmt(s) {
      if (isNaN(s)) return '0:00';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return m + ':' + (sec < 10 ? '0' : '') + sec;
    }

    btn.addEventListener('click', function() {
      if (audio.paused) { audio.play(); btn.textContent = '⏸'; btn.setAttribute('aria-label','Pause'); }
      else { audio.pause(); btn.textContent = '▶'; btn.setAttribute('aria-label','Play'); }
    });

    audio.addEventListener('timeupdate', function() {
      if (!audio.duration) return;
      scrubber.value = (audio.currentTime / audio.duration) * 100;
      timeEl.textContent = fmt(audio.currentTime);
      /* Fade out over last 3 seconds */
      const remaining = audio.duration - audio.currentTime;
      audio.volume = remaining < 3 ? Math.max(0, remaining / 3) : 1;
    });

    audio.addEventListener('ended', function() {
      btn.textContent = '▶'; btn.setAttribute('aria-label','Play');
      scrubber.value = 0; timeEl.textContent = '0:00';
    });

    audio.addEventListener('loadedmetadata', function() {
      scrubber.max = 100;
    });

    scrubber.addEventListener('input', function() {
      if (audio.duration) audio.currentTime = (scrubber.value / 100) * audio.duration;
    });

    wrap.appendChild(audio);
    wrap.appendChild(player);
    return wrap;
  }


  /* ── Build a GIF grid ── */
  function buildGifGrid(gifPaths, altText) {
    const grid = document.createElement('div');
    grid.className = 'gif-grid';


    gifPaths.forEach(function(src) {
      const cell = document.createElement('div');
      cell.className = 'gif-grid-cell';


      const ph = document.createElement('div');
      ph.className = 'gif-grid-placeholder';
      ph.textContent = 'loading';


      const img = document.createElement('img');
      img.alt = altText;
      img.style.display = 'none';
      img.onload = function() {
        img.onload = null;
        img.onerror = null;
        if (ph.parentNode) ph.parentNode.removeChild(ph);
        img.style.display = 'block';
      };
      img.onerror = function() {
        img.onload = null;
        img.onerror = null;
        img.style.display = 'none';
        ph.textContent = 'image';
      };
      img.src = src;


      cell.appendChild(ph);
      cell.appendChild(img);
      grid.appendChild(cell);
    });


    return grid;
  }

        return path.toLowerCase().indexOf('process') === -1;
      });
      const processImagePaths = (p.imagePaths || []).filter(function(path) {
        return path.toLowerCase().indexOf('process') !== -1;
      });


      /* media: images/gifs first, then videos, then audio */
      if (p.mediaRows && p.mediaRows.length) {
        p.mediaRows.forEach(function(row, idx) {
          const rowEl = buildImagePairWrap(row, p.title);
          if (idx > 0) rowEl.style.marginTop = '0.75rem';
          card.appendChild(rowEl);
        });
      } else if (p.gifPaths && p.gifPaths.length) {
        card.appendChild(buildGifGrid(p.gifPaths, p.title));
      } else if ((p.imagePairPaths && p.imagePairPaths.length) || mainImagePaths.length) {
        if (p.imagePairPaths && p.imagePairPaths.length) {
          card.appendChild(buildImagePairWrap(p.imagePairPaths, p.title));
        }
        mainImagePaths.forEach(function(basePath) {
          card.appendChild(buildImageWrap(basePath, p.title));
        });
      }
      if (p.videoPaths && p.videoPaths.length) {
        p.videoPaths.forEach(function(src) {
          card.appendChild(buildVideoWrap(src, p.title, p.thumbnailGif || null));
        });
      }
      if (p.audioPaths && p.audioPaths.length) {
        p.audioPaths.forEach(function(src) {
          card.appendChild(buildAudioWrap(src, p.title));
        });
      }


      /* byline */
      const byline = document.createElement('p');
      byline.className = 'project-byline';
      let bylineHTML = escapeHtml(p.year + ', ' + p.tools);
      if (p.modelCardUrl) {
        bylineHTML += ' <a href="' + escapeHtml(p.modelCardUrl) + '" target="_blank" rel="noopener">AI Model Card available here.</a>';
      }
      byline.innerHTML = bylineHTML;
      card.appendChild(byline);


      /* body copy: Rationale → Project Description → My Role */
      const bodyWrap = document.createElement('div');
      bodyWrap.className = 'project-body-wrap';


      let bodyHTML =
        '<p class="project-label">Rationale</p>' +
        '<p class="project-body">' + p.rationale.replace(/\n/g, '<br>') + '</p>' +
        '<p class="project-label">Project Description</p>' +
        '<p class="project-body">' + p.description.replace(/\n/g, '<br>') + '</p>';


      if (p.role) {
        bodyHTML +=
          '<p class="project-label">My Role</p>' +
          '<p class="project-body">' + p.role + '</p>';
      }


      bodyWrap.innerHTML = bodyHTML;
      card.appendChild(bodyWrap);


      /* Process Documentation — images with "process" in filename, at the bottom */
      if (processImagePaths.length) {
        const processLabel = document.createElement('p');
        processLabel.className = 'project-label';
        processLabel.textContent = 'Process Documentation';
        card.appendChild(processLabel);

        processImagePaths.forEach(function(basePath) {
          card.appendChild(buildImageWrap(basePath, p.title + ' process'));
        });
      }


      container.appendChild(card);
    });


    updateFirstVisibleBorder();
  }


  /* ── Filter logic ── */
  function updateFirstVisibleBorder() {
    const cards = document.querySelectorAll('.project-card');
    let foundFirst = false;
    cards.forEach(function(card) {
      card.style.borderTop = '';
      if (!card.classList.contains('hidden') && !foundFirst) {
        card.style.borderTop = '1px solid #000';
        foundFirst = true;
      }
    });
  }


  function applyFilter(filter) {
    const cards = document.querySelectorAll('.project-card');
    cards.forEach(function(card) {
      if (filter === 'all' || card.dataset.type === filter) {
        card.classList.remove('hidden');
      } else {
        card.classList.add('hidden');
      }
    });
    updateFirstVisibleBorder();
  }


  document.getElementById('filter-bar').addEventListener('click', function(e) {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    applyFilter(btn.dataset.filter);
  });


  renderProjects();

  (function () {
    const hash = window.location.hash.slice(1);
    if (!hash) return;
    const match = projects.find(function (p) { return p.id === hash; });
    if (!match) return;
    document.body.classList.add('project-focus');
    document.title = match.title + ' | Emily Reardon';
    document.querySelectorAll('.project-card').forEach(function (card) {
      if (card.dataset.id !== hash) card.style.display = 'none';
    });
    const backLink = document.createElement('a');
    backLink.href = 'projects.html';
    backLink.className = 'project-back-link';
    backLink.textContent = '\u2190 All projects';
    const main = document.getElementById('projects-list');
    if (!main.querySelector('.project-back-link')) main.insertBefore(backLink, main.firstChild);
    const focusBtn = document.querySelector('.project-card[data-id="' + hash + '"] .project-open-btn');
    if (focusBtn) focusBtn.remove();
  })();

  /* ── Single-project focus mode (URL hash = project id) ── */
  (function () {
    const hash = window.location.hash.slice(1);
    if (!hash) return;
    const match = projects.find(function (p) { return p.id === hash; });
    if (!match) return;

    document.body.classList.add('project-focus');
    document.title = match.title + ' | Emily Reardon';

    document.querySelectorAll('.project-card').forEach(function (card) {
      if (card.dataset.id !== hash) card.style.display = 'none';
    });

    const backLink = document.createElement('a');
    backLink.href = 'projects.html';
    backLink.className = 'project-back-link';
    backLink.textContent = '\u2190 All projects';
    const main = document.getElementById('projects-list');
    if (!main.querySelector('.project-back-link')) main.insertBefore(backLink, main.firstChild);

    const focusBtn = document.querySelector('.project-card[data-id="' + hash + '"] .project-open-btn');
    if (focusBtn) focusBtn.remove();
  })();




  /* ── Dot animation ── */
  const MAX_DOTS  = 7;
  const NUM_SLOTS = 12;


  function buildSlotPool() {
    const pool = [];
    const firstNameWeight = 10;
    const lastNameWeight  = 3;
    for (let i = 0; i < NUM_SLOTS; i++) {
      const w = i <= 4 ? firstNameWeight : lastNameWeight;
      for (let k = 0; k < w; k++) pool.push(i);
    }
    return pool;
  }
  const SLOT_POOL = buildSlotPool();


  function randomSlot() {
    return SLOT_POOL[Math.floor(Math.random() * SLOT_POOL.length)];
  }


  let liveSlots = new Map();
  let frontier  = 0;


  function getLetterSpan(slotIndex) {
    return document.querySelector('[data-slot="' + slotIndex + '"]');
  }


  const SIZES = ['sz-sm', 'sz-md', 'sz-lg'];


  function createDot(letterSpan) {
    const dot = document.createElement('span');
    dot.className = 'period-dot ' + SIZES[Math.floor(Math.random() * SIZES.length)];
    letterSpan.parentNode.insertBefore(dot, letterSpan.nextSibling);
    requestAnimationFrame(function() {
      requestAnimationFrame(function() { dot.classList.add('visible'); });
    });
    return dot;
  }


  function removeDot(dot) {
    dot.classList.remove('visible');
    dot.addEventListener('transitionend', function() { dot.remove(); }, { once: true });
  }


  function totalDots() {
    let n = 0;
    liveSlots.forEach(function(arr) { n += arr.length; });
    return n;
  }


  function step() {
    const total     = totalDots();
    const canAdd    = total < MAX_DOTS;
    const canRemove = total > 0;
    let action;
    const r = Math.random();


    if (!canAdd && canRemove) {
      action = r < 0.5 ? 'remove' : 'shift';
    } else if (!canRemove) {
      action = 'add';
    } else {
      if (r < 0.45)      action = 'add';
      else if (r < 0.72) action = 'shift';
      else               action = 'remove';
    }


    if (action === 'add')         { doAdd(); }
    else if (action === 'remove') { doRemove(); }
    else                          { doRemove(); doAdd(); }
  }


  function doAdd() {
    let targetSlot;
    const scatter = Math.random() < 0.22;


    if (scatter) {
      targetSlot = randomSlot();
    } else {
      const advance = Math.floor(Math.random() * 4);
      targetSlot = (frontier + advance) % NUM_SLOTS;
      if (targetSlot > 4 && Math.random() < 0.70) {
        targetSlot = Math.floor(Math.random() * 5);
      }
    }


    const existing = liveSlots.get(targetSlot) || [];
    if (existing.length >= 2) {
      targetSlot = (targetSlot + 1) % NUM_SLOTS;
    }


    const letterSpan = getLetterSpan(targetSlot);
    if (!letterSpan) return;


    const dot = createDot(letterSpan);
    if (!liveSlots.has(targetSlot)) liveSlots.set(targetSlot, []);
    liveSlots.get(targetSlot).push(dot);
    frontier = targetSlot;
  }


  function doRemove() {
    if (liveSlots.size === 0) return;
    const slots    = Array.from(liveSlots.keys()).sort(function(a, b) { return a - b; });
    const pickLeft = Math.random() < 0.65;
    const targetSlot = pickLeft
      ? slots[0]
      : slots[Math.floor(Math.random() * slots.length)];


    const arr = liveSlots.get(targetSlot);
    if (!arr || arr.length === 0) return;


    const dot = arr.shift();
    removeDot(dot);
    if (arr.length === 0) liveSlots.delete(targetSlot);
  }


  function scheduleNext() {
    let delay;
    const r = Math.random();
    if (r < 0.12) {
      delay = 6000 + Math.random() * 4000;
    } else if (r < 0.30) {
      delay = 1800 + Math.random() * 800;
    } else {
      delay = 2500 + Math.random() * 1500;
    }
    setTimeout(function() { step(); scheduleNext(); }, delay);
  }


  function init() {
    const seedSlots = [1, 3, 4];
    seedSlots.forEach(function(s) {
      const letterSpan = getLetterSpan(s);
      if (!letterSpan) return;
      const dot = createDot(letterSpan);
      if (!liveSlots.has(s)) liveSlots.set(s, []);
      liveSlots.get(s).push(dot);
    });
    frontier = 4;
    scheduleNext();
  }


  init();


  const hamburger    = document.querySelector('.hamburger');
  const navContainer = document.getElementById('nav-container');
  if (hamburger && navContainer) {
    hamburger.addEventListener('click', () => {
      navContainer.classList.toggle('menu-open');
    });
  }
</script>
  <script>
    (function() {
      var fonts = ["'Josefin Sans', sans-serif", "'Poiret One', sans-serif", "'Fraunces', serif"];
      var styles = ["normal", "normal", "italic"];
      var SIZES = ['sz-sm', 'sz-md', 'sz-lg'];
      var stored;
      try { stored = JSON.parse(sessionStorage.getItem('emNav15')); } catch(e) {}
      if (!stored) stored = {};
      var changed = false;

      function scheduleDot(anchor, initialDelay) {
        var holdMs = 1800 + Math.floor(Math.random() * 1200);
        var waitMs = 8000 + Math.floor(Math.random() * 12000);
        function insertDot() {
          var dot = document.createElement('span');
          dot.className = 'period-dot ' + SIZES[Math.floor(Math.random() * SIZES.length)];
          anchor.parentNode.insertBefore(dot, anchor.nextSibling);
          requestAnimationFrame(function() {
            requestAnimationFrame(function() { dot.classList.add('visible'); });
          });
          setTimeout(function() {
            dot.classList.remove('visible');
            dot.addEventListener('transitionend', function() {
              if (dot.parentNode) dot.remove();
              setTimeout(insertDot, waitMs);
            }, { once: true });
          }, holdMs);
        }
        setTimeout(insertDot, initialDelay || 0);
      }

      document.querySelectorAll('.nav-links a').forEach(function(el) {
        var key = el.getAttribute('href') || el.textContent.trim();
        var isPDF = key.indexOf('.pdf') !== -1;
        if (!stored[key]) {
          var text = el.textContent.trim().replace(/\.$/g, '');
          var chars = [];
          for (var i = 0; i < text.length; i++) chars.push(Math.floor(Math.random() * fonts.length));
          var periods = [];
          if (!isPDF) {
            var numP = 2 + Math.floor(Math.random() * 2);
            var tries = 0;
            while (periods.length < numP && tries < 20) {
              var pos = Math.floor(Math.random() * (text.length - 1));
              if (periods.indexOf(pos) === -1) periods.push(pos);
              tries++;
            }
          }
          stored[key] = { chars: chars, periods: periods };
          changed = true;
        }
        var word = stored[key];
        var text = el.textContent.trim().replace(/\.$/g, '');
        var html = '';
        for (var i = 0; i < text.length; i++) {
          var fi = word.chars[i % word.chars.length] % fonts.length;
          html += '<span style="font-family:' + fonts[fi] + ';font-style:' + styles[fi] + ';font-weight:300">' + text[i] + '</span>';
        }
        el.innerHTML = html;
        el.style.visibility = 'visible';
        // lock width so inline dots don't shift sibling nav words
        el.style.whiteSpace = 'nowrap';
        el.style.width = el.getBoundingClientRect().width + 'px';
        el.style.overflow = 'visible';
        if (!isPDF && word.periods) {
          var letterSpans = el.querySelectorAll('span');
          var wordBase = Math.floor(Math.random() * 1500);
          word.periods.forEach(function(pos, pidx) {
            if (letterSpans[pos]) {
              var delay = wordBase + pidx * (800 + Math.floor(Math.random() * 1200));
              scheduleDot(letterSpans[pos], delay);
            }
          });
        }
      });
      if (changed) try { sessionStorage.setItem('emNav15', JSON.stringify(stored)); } catch(e) {}
    })();
  </script>
